name: Build Kortex AI v1.0.0

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Kortex-AI-v1.0.0.apk
      - name: Upload Kortex AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Kortex-AI-v1.0.0
          path: Kortex-AI-v1.0.0.apk
