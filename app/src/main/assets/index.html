<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#171717">
<title>Kortex AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://js.puter.com/v2/"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --bg:#171717; --surface:#212121; --elev:#2F2F2F; --stroke:#3A3A3A;
  --text:#ECECEC; --muted:#9A9A9A; --dim:#6E6E6E; --link:#8AB4F8;
  --ok:#34D399; --bad:#F87171; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--stroke)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--elev);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#topbar{display:flex;align-items:center;gap:4px;padding:calc(6px + var(--safe-t)) 8px 6px;flex:0 0 auto}
.icon-btn{width:40px;height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:transparent;border:0;border-radius:10px;color:#B4B4B4}
.icon-btn:hover{background:var(--elev);color:#fff}
.icon-btn svg{width:22px;height:22px}
#modelBadge{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:0;
  color:var(--text);font-size:15px;font-weight:600;padding:9px 12px;border-radius:10px;min-width:0}
#modelBadge:hover{background:var(--elev)}
#modelBadgeText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modelBadge svg{width:14px;height:14px;opacity:.55;flex:0 0 auto}

#chatScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#messages{max-width:768px;margin:0 auto;padding:20px 16px 12px}
.msg-user{display:flex;flex-direction:column;align-items:flex-end;margin:18px 0}
.bubble{background:var(--elev);border-radius:20px;padding:10px 16px;max-width:85%;
  white-space:pre-wrap;word-break:break-word}
.msg-atts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:6px}
.msg-ai{margin:22px 0}
.ai-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ai-avatar{width:24px;height:24px;border-radius:8px;background:var(--elev);border:1px solid var(--stroke);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.ai-name{font-size:13px;font-weight:600;color:#B4B4B4}
.ai-model{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--elev);
  border-radius:999px;padding:2px 8px}
.ai-status{color:var(--muted);font-size:14px;margin-right:8px}
.typing{display:inline-flex;gap:4px;vertical-align:middle}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.msg-actions{margin-top:10px}
.msg-act{background:transparent;border:1px solid var(--stroke);color:#B4B4B4;border-radius:8px;
  padding:5px 10px;font-size:12.5px}
.msg-act:hover{background:var(--elev);color:#fff}
.sys-note{display:table;margin:14px auto;background:var(--surface);border:1px solid var(--elev);
  color:var(--muted);font-size:12.5px;border-radius:999px;padding:6px 14px;max-width:92%;text-align:center}

.md{line-height:1.65;word-break:break-word}
.md p{margin:.5em 0}
.md h1,.md h2,.md h3,.md h4{margin:1em 0 .4em;line-height:1.3;font-weight:650}
.md h1{font-size:1.3em}.md h2{font-size:1.18em}.md h3{font-size:1.06em}.md h4{font-size:1em}
.md ul,.md ol{margin:.5em 0;padding-left:1.4em}
.md li{margin:.25em 0}
.md blockquote{margin:.6em 0;border-left:3px solid var(--stroke);padding-left:12px;color:#B4B4B4}
.md hr{border:0;border-top:1px solid var(--elev);margin:16px 0}
.md a{color:var(--link)}
.md code{background:var(--elev);border-radius:6px;padding:2px 6px;font-size:.9em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.md-table{overflow-x:auto;margin:.6em 0}
.md table{border-collapse:collapse;font-size:.95em}
.md th,.md td{border:1px solid var(--elev);padding:6px 10px;text-align:left}
.md th{background:var(--surface)}
.code-block{margin:12px 0;border:1px solid var(--elev);border-radius:12px;overflow:hidden;background:#0F0F0F}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--surface);padding:6px 10px;font-size:12px;color:var(--muted)}
.code-tools{display:flex;gap:6px}
.code-btn{background:transparent;border:1px solid var(--stroke);color:#B4B4B4;border-radius:6px;
  padding:3px 8px;font-size:12px}
.code-btn:hover{background:var(--elev);color:#fff}
.code-block pre{margin:0;padding:12px;overflow-x:auto}
.code-block code,.code-block code.hljs{background:transparent;padding:0;font-size:13px;line-height:1.55;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

.consilium-card{border:1px solid var(--elev);background:var(--surface);border-radius:14px;
  padding:12px 14px;margin:18px 0}
.cc-title{font-size:13px;font-weight:600;margin-bottom:10px}
.cc-chips{display:flex;flex-wrap:wrap;gap:8px}
.cc-chip{font-size:12px;background:var(--bg);border:1px solid var(--elev);border-radius:999px;
  padding:5px 10px;color:#B4B4B4}
.cc-chip em{font-style:normal;margin-left:6px}
.cc-chip.run em{animation:blink 1.2s infinite}
.cc-chip.ok em{color:var(--ok)}
.cc-chip.fail em{color:var(--bad)}
.cc-phase{margin-top:10px;font-size:12.5px;color:var(--muted)}

#composer{flex:0 0 auto;padding:6px 12px calc(10px + var(--safe-b));background:var(--bg)}
#attachRow,#pluginChips{max-width:768px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:6px}
.att-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--elev);
  border-radius:10px;padding:6px 10px;font-size:12.5px;max-width:100%}
.att-chip i{font-style:normal;color:var(--dim);font-size:11px}
.att-chip button{background:transparent;border:0;color:var(--muted);font-size:13px;padding:0 2px}
.att-chip.static{color:#B4B4B4}
.plugin-chip{background:var(--elev);border:1px solid var(--stroke);color:var(--text);
  border-radius:999px;padding:5px 12px;font-size:12.5px}
#inputRow{max-width:768px;margin:0 auto;display:flex;align-items:flex-end;gap:4px;
  background:var(--elev);border:1px solid transparent;border-radius:26px;padding:6px 8px}
#inputRow:focus-within{border-color:var(--stroke)}
#input{flex:1;background:transparent;border:0;outline:0;resize:none;color:var(--text);
  font:16px/1.5 inherit;font-family:inherit;max-height:160px;padding:8px 4px;min-width:0}
#input::placeholder{color:var(--dim)}
#btnPlus,#btnMic{width:36px;height:36px}
.send-btn{width:36px;height:36px;flex:0 0 auto;border:0;border-radius:50%;background:var(--text);
  color:var(--bg);display:flex;align-items:center;justify-content:center}
.send-btn:disabled{opacity:.35;cursor:default}
.send-btn svg{width:20px;height:20px}
#composerHint{max-width:768px;margin:8px auto 0;text-align:center;font-size:11px;color:var(--dim)}

#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30}
#sidebar{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);z-index:40;background:var(--surface);
  border-right:1px solid var(--elev);display:flex;flex-direction:column;padding:calc(12px + var(--safe-t)) 12px calc(12px + var(--safe-b));
  transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sidebar.open{transform:none}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--bg);border:1px solid var(--stroke);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.side-new{width:100%;text-align:left;background:transparent;border:1px solid var(--stroke);border-radius:12px;
  padding:10px 12px;font-size:14px;font-weight:600;color:var(--text);margin-bottom:10px}
.side-new:hover{background:var(--elev)}
#chatSearch{width:100%;background:var(--bg);border:1px solid var(--elev);border-radius:10px;
  padding:8px 12px;color:var(--text);font-size:14px;outline:0;margin-bottom:10px}
#chatSearch:focus{border-color:var(--stroke)}
#chatList{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
.chat-item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;cursor:pointer}
.chat-item:hover{background:var(--elev)}
.chat-item.active{background:var(--elev)}
.ci-title{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-edit{flex:1;min-width:0;background:var(--bg);border:1px solid var(--stroke);border-radius:6px;
  color:var(--text);font-size:14px;padding:3px 6px;outline:0}
.ci-btn{width:26px;height:26px;flex:0 0 auto;background:transparent;border:0;border-radius:6px;
  color:var(--muted);font-size:13px;opacity:.55}
.chat-item:hover .ci-btn{opacity:1}
.ci-btn:hover{background:var(--stroke);color:#fff}
.ci-btn.armed{color:var(--bad);opacity:1}
.ci-empty{color:var(--dim);font-size:13px;text-align:center;padding:16px 0}
.side-sep{height:1px;background:var(--elev);margin:10px 0}
.side-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:2px 2px 8px}
.svc{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;
  background:transparent;border:0;color:#D9D9D9;font-size:14px;text-align:left}
.svc:hover{background:var(--elev)}
.svc-dot{width:8px;height:8px;border-radius:50%;background:var(--c,#8A8A8A);flex:0 0 auto}
.side-auth{width:100%;background:transparent;border:1px solid var(--stroke);border-radius:12px;
  padding:10px 12px;color:var(--text);font-size:13.5px;text-align:left}
.side-auth:hover{background:var(--elev)}
.side-foot{font-size:11px;color:var(--dim);text-align:center;padding-top:10px}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--elev);border-radius:20px 20px 0 0;
  padding:8px 12px calc(16px + var(--safe-b));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--stroke);margin:6px auto 10px}
.sheet-title{font-size:13px;color:var(--muted);padding:0 6px 8px}
.sheet-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:12px;
  background:transparent;border:0;color:var(--text);text-align:left}
.sheet-item:hover{background:var(--elev)}
.si-ico{font-size:20px;width:28px;text-align:center;flex:0 0 auto}
.si-txt{flex:1;display:flex;flex-direction:column;min-width:0}
.si-txt b{font-size:14.5px;font-weight:600}
.si-txt i{font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.sheet-sep{height:1px;background:var(--elev);margin:6px 0}
.switch{width:40px;height:24px;flex:0 0 auto;border-radius:999px;background:var(--stroke);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:left .2s,background .2s}
.switch.on{background:var(--text)}
.switch.on::after{left:19px;background:var(--bg)}

.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;
  justify-content:center;padding:20px}
.modal-card{background:var(--surface);border:1px solid var(--elev);border-radius:18px;width:100%;
  max-width:420px;max-height:80vh;overflow-y:auto;padding:16px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:12px}
.model-item{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;
  border-radius:12px;border:1px solid transparent;background:transparent;color:var(--text);text-align:left}
.model-item:hover{background:var(--elev)}
.model-item.selected{border-color:var(--stroke);background:var(--elev)}
.mi-name{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.mi-check{color:var(--ok)}
.mi-desc{font-size:12px;color:var(--muted)}
.modal-close{width:100%;margin-top:10px;padding:10px;border-radius:10px;background:var(--elev);
  border:0;color:var(--text);font-size:14px}

#voiceOverlay{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:24px}
.voice-close{position:absolute;top:calc(12px + var(--safe-t));right:12px}
#sphereWrap{width:200px;height:200px;position:relative;display:flex;align-items:center;justify-content:center;--rms:0}
#sphere{width:140px;height:140px;border-radius:50%;border:1px solid var(--stroke);
  background:radial-gradient(circle at 32% 30%,#4A4A4A,#2F2F2F 45%,#171717 78%);
  box-shadow:0 0 60px rgba(255,255,255,.08),inset 0 0 30px rgba(255,255,255,.06);
  transform:scale(calc(1 + var(--rms)*.35));transition:transform .08s linear}
.sphere-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.12);
  opacity:.25;animation:ringPulse 2.4s ease-out infinite;animation-play-state:paused}
.sphere-ring.r2{animation-delay:1.2s}
@keyframes ringPulse{0%{transform:scale(.72);opacity:.9}100%{transform:scale(1.16);opacity:0}}
#voiceOverlay[data-state="listening"] .sphere-ring,
#voiceOverlay[data-state="speaking"] .sphere-ring{animation-play-state:running}
#voiceOverlay[data-state="listening"] #sphere{animation:breathe 2.2s ease-in-out infinite}
#voiceOverlay[data-state="thinking"] #sphere{animation:thinkPulse 1s ease-in-out infinite alternate}
#voiceOverlay[data-state="thinking"] .sphere-ring{animation-play-state:running;animation-duration:1.2s}
#voiceOverlay[data-state="speaking"] #sphere{animation:speakWave .85s ease-in-out infinite alternate}
@keyframes breathe{0%,100%{box-shadow:0 0 50px rgba(255,255,255,.07),inset 0 0 30px rgba(255,255,255,.06)}
  50%{box-shadow:0 0 80px rgba(255,255,255,.14),inset 0 0 40px rgba(255,255,255,.1)}}
@keyframes thinkPulse{from{transform:scale(.94);filter:brightness(.9)}to{transform:scale(1.03);filter:brightness(1.25)}}
@keyframes speakWave{from{transform:scale(1)}to{transform:scale(1.09)}}
#voiceStatus{font-size:17px;font-weight:600}
#voiceTranscript{min-height:48px;max-width:520px;text-align:center;color:#B4B4B4;font-size:15px;line-height:1.5}
#voiceHint{font-size:12.5px;color:var(--dim);text-align:center}

#sandboxOverlay{position:fixed;inset:0;z-index:65;background:var(--bg);display:flex;flex-direction:column}
.sb-head{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 12px 10px;
  border-bottom:1px solid var(--elev);flex-wrap:wrap}
.sb-title{font-size:14px;font-weight:600}
.sb-tabs{display:flex;background:var(--surface);border-radius:10px;padding:3px}
.sb-tab{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--muted);background:transparent;border:0}
.sb-tab.active{background:var(--elev);color:var(--text)}
.sb-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.sb-btn{background:var(--elev);border:1px solid var(--stroke);color:var(--text);border-radius:10px;
  padding:7px 12px;font-size:13px}
.sb-btn:hover{background:var(--stroke)}
#sbBody{flex:1;position:relative;overflow:hidden}
#sbCode{position:absolute;inset:0;width:100%;height:100%;background:#0F0F0F;color:var(--text);
  border:0;outline:0;resize:none;padding:14px;font-size:13px;line-height:1.55;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#sbFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#sbBody[data-tab="code"] #sbFrame{display:none}
#sbBody[data-tab="preview"] #sbCode{display:none}
@media (min-width:900px){
  #sbBody[data-tab] #sbCode{display:block;width:50%}
  #sbBody[data-tab] #sbFrame{display:block;left:50%;width:50%}
  .sb-tabs{display:none}
}

#welcome{text-align:center;padding:10vh 8px 24px}
#welcome h1{font-size:26px;font-weight:700;margin:14px 0 6px}
#welcome p{color:var(--muted);font-size:14.5px;margin:0 0 22px}
.sugg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto}
.sugg{background:var(--surface);border:1px solid var(--elev);border-radius:14px;padding:14px;
  font-size:13.5px;color:#D9D9D9;text-align:left;line-height:1.4}
.sugg:hover{background:var(--elev)}

#toasts{position:fixed;bottom:calc(96px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:90;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:var(--elev);border:1px solid var(--stroke);color:var(--text);padding:10px 16px;
  border-radius:12px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fadeUp .25s;max-width:90vw}
.toast.out{opacity:0;transform:translateY(6px);transition:.3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:600px){
  #messages{padding:16px 12px}
  .bubble{max-width:92%}
  .sugg-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="icon-btn" id="btnMenu" aria-label="Меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button id="modelBadge" aria-label="Выбор модели">
      <span id="modelBadgeText">⚡ Консилиум</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="icon-btn" id="btnNewChat" aria-label="Новый чат">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <div id="chatScroll"><div id="messages"></div></div>

  <footer id="composer">
    <div id="attachRow" class="hidden"></div>
    <div id="pluginChips" class="hidden"></div>
    <div id="inputRow">
      <button class="icon-btn" id="btnPlus" aria-label="Плагины">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Сообщение Kortex AI…"></textarea>
      <button class="icon-btn" id="btnMic" aria-label="Голосовой ассистент">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="send-btn" id="btnSend" aria-label="Отправить" disabled>
        <svg id="icoSend" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg id="icoStop" class="hidden" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
      </button>
    </div>
    <div id="composerHint">Kortex AI · Puter.js · ответы ИИ могут содержать ошибки</div>
  </footer>
</div>

<div id="backdrop" class="hidden"></div>

<aside id="sidebar" aria-label="Боковая панель">
  <div class="side-head">

function codeBlockHtml(code,lang,hl){
  var id='cb'+(++codeSeq); CODE_STORE[id]=code;
  var l=(lang||'').toLowerCase();

    '</span></div><pre><code class="hljs">'+(hl?highlight(code,l):esc(code))+'</code></pre></div>';

function inlineMd(s){
  var codes=[];
  s=s.replace(/`([^`\n]+)`/g,function(_,c){codes.push(c);return '\u0000'+(codes.length-1)+'\u0000';});
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  s=s.replace(/(^|[\s(])_([^_\n]+)_/g,'$1<i>$2</i>');
  s=s.replace(/~~([^~]+)~~/g,'<s>$1</s>');
  s=s.replace(/\u0000(\d+)\u0000/g,function(_,i){return '<code>'+codes[+i]+'</code>';});
  return s;
}
function renderMarkdown(src,hl){
  var lines=String(src).replace(/\r\n?/g,'\n').split('\n'), out='', i=0;
  function isTableSep(l){return /^\s*\|?\s*:?-{3,}[\s:|-]*$/.test(l)&&l.indexOf('-')>=0;}
  function cells(l){return l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){return c.trim();});}
  while(i<lines.length){
    var line=lines[i];
    var f=line.match(/^\s*```(\S*)\s*$/);
    if(f){var buf=[];i++;while(i<lines.length&&!/^\s*```\s*$/.test(lines[i])){buf.push(lines[i]);i++;}i++;out+=codeBlockHtml(buf.join('\n'),f[1],hl);continue;}
    if(/^\s*$/.test(line)){i++;continue;}
    var h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){var n=Math.min(h[1].length,4);out+='<h'+n+'>'+inlineMd(esc(h[2]))+'</h'+n+'>';i++;continue;}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){out+='<hr>';i++;continue;}
    if(/^\s*>\s?/.test(line)){var q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++;}out+='<blockquote>'+q.map(function(l){return inlineMd(esc(l));}).join('<br>')+'</blockquote>';continue;}
    if(/^\s*[-*+]\s+/.test(line)){var ul=[];while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){ul.push(lines[i].replace(/^\s*[-*+]\s+/,''));i++;}out+='<ul>'+ul.map(function(l){return '<li>'+inlineMd(esc(l))+'</li>';}).join('')+'</ul>';continue;}
    if(/^\s*\d+[.)]\s+/.test(line)){var ol=[];while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){ol.push(lines[i].replace(/^\s*\d+[.)]\s+/,''));i++;}out+='<ol>'+ol.map(function(l){return '<li>'+inlineMd(esc(l))+'</li>';}).join('')+'</ol>';continue;}
    if(line.indexOf('|')>=0&&i+1<lines.length&&isTableSep(lines[i+1])){
      var head=cells(line);i+=2;var rows=[];
      while(i<lines.length&&lines[i].indexOf('|')>=0&&!/^\s*$/.test(lines[i])){rows.push(cells(lines[i]));i++;}
      out+='<div class="md-table"><table><thead><tr>'+head.map(function(c){return '<th>'+inlineMd(esc(c))+'</th>';}).join('')+'</tr></thead><tbody>'+
        rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inlineMd(esc(c))+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
      continue;
    }
    var p=[line];i++;
    while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^\s*(#{1,6}\s|```|>|[-*+]\s|\d+[.)]\s)/.test(lines[i])&&!(lines[i].indexOf('|')>=0&&i+1<lines.length&&isTableSep(lines[i+1]))){p.push(lines[i]);i++;}
    out+='<p>'+p.map(function(l){return inlineMd(esc(l));}).join('<br>')+'</p>';
  }
  return out;
}

  puterWait=new Promise(function(res,rej){
    var n=0,t=setInterval(function(){
      if(window.puter&&puter.ai){clearInterval(t);res();}
      else if(++n>60){clearInterval(t);puterWait=null;rej(new Error('Puter.js не загрузился — проверьте интернет'));}
    },250);

function extractText(resp){
  if(!resp)return '';
  if(typeof resp==='string')return resp;
  var m=resp.message||resp, c=m.content;
  if(Array.isArray(c))c=c.map(function(p){return p&&p.text?p.text:'';}).join('');
  if(typeof c==='string'&&c)return c;
  if(typeof resp.text==='string'&&resp.text)return resp.text;
  var s=String(resp);return s==='[object Object]'?'':s;
}
function errText(e){
  if(!e)return 'Неизвестная ошибка';
  if(e.name==='AbortError')return 'Остановлено';
  if(typeof e==='string')return e.slice(0,300);
  var src=e.error||e, m=src.message||src.msg||e.message||src.code||e.code||'';
  if(typeof m==='object')try{m=JSON.stringify(m);}catch(_){m='';}
  return String(m||'Ошибка запроса').slice(0,300);

function addFiles(files){

    var f=list[i];
    if(attachments.length>=6){toast('Максимум 6 файлов');renderAttachChips();return Promise.resolve();}
    var p;
    if(/^image\//.test(f.type)){
      if(f.size>4*1024*1024){toast('Изображение > 4 МБ пропущено');p=Promise.resolve();}
      else p=readAsDataURL(f).then(function(data){attachments.push({id:uid(),name:f.name,kind:'image',mime:f.type,size:f.size,data:data});});
    }else if(/^text\//.test(f.type)||TEXT_EXT.test(f.name)){
      if(f.size>1024*1024){toast('Текстовый файл > 1 МБ пропущен');p=Promise.resolve();}
      else p=readAsText(f).then(function(t){
        if(t.length>150000)t=t.slice(0,150000)+'\n…(обрезано)';
        attachments.push({id:uid(),name:f.name,kind:'text',mime:f.type||'text/plain',size:f.size,text:t});
      });
    }else{
      toast('Загружаю '+f.name+' на локальный сервер…');
      p=fetch('/__upload?name='+encodeURIComponent(f.name),{method:'POST',body:f}).then(function(r){return r.json();}).then(function(j){
        if(j.ok)attachments.push({id:uid(),name:j.name,kind:'file',mime:f.type,size:j.size,url:location.origin+j.url});

    if(v)u.voice=v;
    u.onend=function(){window.KortexVoice.onSpeakEnd();};
    u.onerror=function(){window.KortexVoice.onSpeakEnd();};
    speechSynthesis.speak(u);
  }else{setVoiceState('listening');startListening();}
}
window.KortexVoice={
  onListeningStart:function(){if(voice.active)setVoiceState('listening');},
  onListeningStop:function(){if(voice.active&&voice.state==='listening')setVoiceState('idle');},
  onPartial:function(t){if(voice.active)$('#voiceTranscript').textContent=t;},
  onResult:function(t,final){
    if(!voice.active||!final||voice.paused)return;
    $('#voiceTranscript').textContent=t;
    if(!generating){setVoiceState('thinking');sendMessage(t);}
  },
  onRms:function(l){$('#sphereWrap').style.setProperty('--rms',String(l));},
  onError:function(m){
    toast(m);
    if(!voice.active)return;
    if(/разрешени|permission|не найдена|недоступен|unavailable/i.test(m)){closeVoice();return;}
    setTimeout(function(){if(voice.active&&!voice.paused&&!generating)startListening();},900);
  },
  onSpeakStart:function(){if(voice.active)setVoiceState('speaking');},
  onSpeakEnd:function(){
    if(!voice.active)return;
    if(voice.paused||generating){setVoiceState('idle');return;}
    setVoiceState('listening');startListening();
  }
};
window.KortexDownloads={onSaved:function(name){toast('Сохранено: '+name);}};
function wrapHtml(code){
  if(/<html[\s>]/i.test(code))return code;
  return '<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<style>body{font-family:system-ui,sans-serif;margin:16px;background:#fff;color:#111}</style></head><body>'+code+'</body></html>';
}
function sbSetTab(t){
  $('#sbBody').dataset.tab=t;
  $('#sbTabCode').classList.toggle('active',t==='code');
  $('#sbTabPreview').classList.toggle('active',t==='preview');
}
function openSandbox(code,autorun){
  if(code!=null&&code!=='')$('#sbCode').value=code;
  else if(!$('#sbCode').value)$('#sbCode').value=SB_DEFAULT;
  $('#sandboxOverlay').classList.remove('hidden');
  if(autorun){runSandbox();}else sbSetTab('code');
}
function runSandbox(){
  $('#sbFrame').srcdoc=wrapHtml($('#sbCode').value);
  sbSetTab('preview');
}
function downloadSandbox(){
  var doc=wrapHtml($('#sbCode').value);
  var name='kortex-'+new Date().toISOString().slice(0,19).replace(/[T:]/g,'-')+'.html';
  var n=native();
  if(n){n.saveTextFile(name,doc);return;}
  var blob=new Blob([doc],{type:'text/html'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
  toast('Скачан '+name);
}
function refreshAuth(){
  var el=$('#authName');
  if(!window.puter||!puter.auth){el.textContent='Puter · нет сети';return Promise.resolve();}
  try{
    if(puter.auth.isSignedIn()){
      return puter.auth.getUser().then(function(u){el.textContent='Puter · @'+(u&&u.username?u.username:'user')+' — выйти';}).catch(function(){el.textContent='Puter · войти';});
    }
    el.textContent='Puter · войти';
  }catch(e){el.textContent='Puter · войти';}
  return Promise.resolve();
}
function authClick(){
  if(!window.puter||!puter.auth){toast('Puter.js не загружен');return;}
  try{
    if(puter.auth.isSignedIn()){
      Promise.resolve(puter.auth.signOut()).then(function(){toast('Вышли из Puter');refreshAuth();});
    }else{
      Promise.resolve(puter.auth.signIn()).then(function(){toast('Вход выполнен — модели активны');refreshAuth();}).catch(function(){toast('Вход отменён');});
    }
  }catch(e){toast('Ошибка авторизации Puter');}
}
function autosize(){
  var t=$('#input');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px';
}
function init(){
  loadAll();
  updateModelBadge();renderPluginChips();syncSwitches();renderAll();renderChatList();setSendState();
  $('#btnMenu').addEventListener('click',openSidebar);
  $('#btnCloseSide').addEventListener('click',closeOverlays);
  $('#backdrop').addEventListener('click',closeOverlays);
  $('#btnPlus').addEventListener('click',openPlus);
  $('#btnNewChat').addEventListener('click',newChat);
  $('#btnNewChatSide').addEventListener('click',newChat);
  $('#btnMic').addEventListener('click',openVoice);
  $('#btnSend').addEventListener('click',function(){
    if(generating){if(abortCtrl)abortCtrl.abort();toast('Останавливаю…');}
    else sendMessage();
  });
  $('#input').addEventListener('input',function(){autosize();setSendState();});
  $('#input').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey&&window.matchMedia&&matchMedia('(pointer:fine)').matches){e.preventDefault();sendMessage();}
  });
  $('#modelBadge').addEventListener('click',function(){renderModelList();$('#modelModal').classList.remove('hidden');});
  $('#btnModelClose').addEventListener('click',function(){$('#modelModal').classList.add('hidden');});
  $('#modelModal').addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden');});
  $('#modelList').addEventListener('click',function(e){
    var it=e.target.closest('.model-item');if(!it)return;
    setModel(it.dataset.m);$('#modelModal').classList.add('hidden');
  });
  $('#plSearch').addEventListener('click',function(){togglePlugin('search');});
  $('#plStudy').addEventListener('click',function(){togglePlugin('study');});
  $('#plDev').addEventListener('click',function(){togglePlugin('dev');});
  $('#plAttach').addEventListener('click',function(){closeOverlays();$('#fileInput').click();});
  $('#plSandbox').addEventListener('click',function(){closeOverlays();openSandbox();});
  $('#pluginChips').addEventListener('click',function(e){
    var c=e.target.closest('.plugin-chip');if(c)togglePlugin(c.dataset.pl);
  });
  $('#fileInput').addEventListener('change',function(){var f=this.files;if(f&&f.length)addFiles(f);this.value='';});
  $('#attachRow').addEventListener('click',function(e){
    var b=e.target.closest('button[data-id]');if(!b)return;
    attachments=attachments.filter(function(a){return a.id!==b.dataset.id;});
    renderAttachChips();
  });
  $('#chatSearch').addEventListener('input',function(){renderChatList(this.value);});
  $('#chatList').addEventListener('click',function(e){
    var item=e.target.closest('.chat-item');if(!item)return;
    var id=item.dataset.id;
    var ren=e.target.closest('.ci-ren');
    if(ren){startRename(item,id);return;}
    var del=e.target.closest('.ci-del');
    if(del){
      if(del.dataset.arm){deleteChat(id);}
      else{del.dataset.arm='1';del.textContent='⚠';del.classList.add('armed');
        setTimeout(function(){if(del.isConnected){delete del.dataset.arm;del.textContent='✕';del.classList.remove('armed');}},2500);}
      return;
    }
    selectChat(id);
  });
  $('#svcLinks').addEventListener('click',function(e){
    var b=e.target.closest('.svc');if(!b)return;
    closeOverlays();
    location.href=b.dataset.url;
  });
  $('#btnAuth').addEventListener('click',authClick);
  msgsEl.addEventListener('click',function(e){
    var sugg=e.target.closest('.sugg');
    if(sugg){$('#input').value=sugg.dataset.q;sendMessage();return;}
    var cb=e.target.closest('.code-btn');
    if(cb){
      var code=CODE_STORE[cb.dataset.code]||'';
      if(cb.dataset.act==='copy')copyText(code,cb);
      else openSandbox(code,true);
      return;
    }
    var ma=e.target.closest('.msg-act');
    if(ma){var holder=ma.closest('.msg-ai');copyText(holder&&holder._raw?holder._raw:'',ma);}
  });
  $('#btnVoiceClose').addEventListener('click',closeVoice);
  $('#sphereWrap').addEventListener('click',function(){
    if(!voice.active)return;
    voice.paused=!voice.paused;
    if(voice.paused){
      stopListening();
      var n=native();if(n)n.stopSpeaking();
      if(window.speechSynthesis)try{speechSynthesis.cancel();}catch(e){}
      setVoiceState('idle');
    }else{setVoiceState('listening');startListening();}
  });
  $('#sbTabCode').addEventListener('click',function(){sbSetTab('code');});
  $('#sbTabPreview').addEventListener('click',function(){sbSetTab('preview');});
  $('#btnSbRun').addEventListener('click',runSandbox);
  $('#btnSbDownload').addEventListener('click',downloadSandbox);
  $('#btnSbClose').addEventListener('click',function(){$('#sandboxOverlay').classList.add('hidden');});
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(voice.active)closeVoice();
    else if(!$('#sandboxOverlay').classList.contains('hidden'))$('#sandboxOverlay').classList.add('hidden');
    else if(!$('#modelModal').classList.contains('hidden'))$('#modelModal').classList.add('hidden');
    else closeOverlays();
  });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){clearTimeout(saveTimer);try{localStorage.setItem(LS_CHATS,JSON.stringify(chats));}catch(e){}}
  });
  waitPuter().then(refreshAuth).catch(function(){$('#authName').textContent='Puter · нет сети';});
}
init();
})();
</script>
</body>
</html>
