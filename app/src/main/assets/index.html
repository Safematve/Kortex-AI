<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#171717">
<title>Kortex AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://js.puter.com/v2/"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#171717; --surface:#212121; --elev:#2F2F2F; --stroke:#3A3A3A;
  --text:#ECECEC; --muted:#9A9A9A; --dim:#6E6E6E; --link:#8AB4F8;
  --ok:#34D399; --warn:#FBBF24; --bad:#F87171;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--stroke)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--elev);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.egg-logo{cursor:pointer;-webkit-user-select:none;user-select:none}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#topbar{display:flex;align-items:center;gap:4px;padding:calc(6px + var(--safe-t)) 8px 6px;flex:0 0 auto}
.icon-btn{width:40px;height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:transparent;border:0;border-radius:10px;color:#B4B4B4}
.icon-btn:hover{background:var(--elev);color:#fff}
.icon-btn svg{width:22px;height:22px}
#modelBadge{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:0;
  color:var(--text);font-size:15px;font-weight:600;padding:9px 10px;border-radius:10px;min-width:0}
#modelBadge:hover{background:var(--elev)}
#modelBadgeText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modelBadge svg{width:14px;height:14px;opacity:.55;flex:0 0 auto}
#speedTag{font-size:12px;color:var(--warn);flex:0 0 auto}

#chatScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#messages{max-width:768px;margin:0 auto;padding:20px 16px 12px}
.msg-user{display:flex;flex-direction:column;align-items:flex-end;margin:18px 0}
.bubble{background:var(--elev);border-radius:20px;padding:10px 16px;max-width:85%;
  white-space:pre-wrap;word-break:break-word}
.msg-atts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:6px}
.msg-ai{margin:22px 0}
.ai-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ai-avatar{width:24px;height:24px;border-radius:8px;background:var(--elev);border:1px solid var(--stroke);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto}
.ai-name{font-size:13px;font-weight:600;color:#B4B4B4}
.ai-model{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--elev);
  border-radius:999px;padding:2px 8px}
.ai-status{color:var(--muted);font-size:14px;margin-right:8px}
.typing{display:inline-flex;gap:4px;vertical-align:middle}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.msg-actions{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.msg-act{background:transparent;border:1px solid var(--stroke);color:#B4B4B4;border-radius:8px;
  padding:5px 10px;font-size:12.5px}
.msg-act:hover{background:var(--elev);color:#fff}
.sys-note{display:table;margin:14px auto;background:var(--surface);border:1px solid var(--elev);
  color:var(--muted);font-size:12.5px;border-radius:999px;padding:6px 14px;max-width:92%;text-align:center}
.gen-wrap{border:1px solid var(--elev);border-radius:14px;overflow:hidden;background:#0F0F0F;max-width:520px}
.gen-img{display:block;width:100%;height:auto}
.gen-missing{padding:22px 16px;text-align:center;color:var(--muted);font-size:13px}
.gen-prompt{margin-top:8px;font-size:12.5px;color:var(--muted)}

.md{line-height:1.65;word-break:break-word}
.md p{margin:.5em 0}
.md h1,.md h2,.md h3,.md h4{margin:1em 0 .4em;line-height:1.3;font-weight:650}
.md h1{font-size:1.3em}.md h2{font-size:1.18em}.md h3{font-size:1.06em}.md h4{font-size:1em}
.md ul,.md ol{margin:.5em 0;padding-left:1.4em}
.md li{margin:.25em 0}
.md blockquote{margin:.6em 0;border-left:3px solid var(--stroke);padding-left:12px;color:#B4B4B4}
.md hr{border:0;border-top:1px solid var(--elev);margin:16px 0}
.md a{color:var(--link)}
.md code{background:var(--elev);border-radius:6px;padding:2px 6px;font-size:.9em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.md-table{overflow-x:auto;margin:.6em 0}
.md table{border-collapse:collapse;font-size:.95em}
.md th,.md td{border:1px solid var(--elev);padding:6px 10px;text-align:left}
.md th{background:var(--surface)}
.code-block{margin:12px 0;border:1px solid var(--elev);border-radius:12px;overflow:hidden;background:#0F0F0F}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--surface);padding:6px 10px;font-size:12px;color:var(--muted)}
.code-tools{display:flex;gap:6px}
.code-btn{background:transparent;border:1px solid var(--stroke);color:#B4B4B4;border-radius:6px;
  padding:3px 8px;font-size:12px}
.code-btn:hover{background:var(--elev);color:#fff}
.code-block pre{margin:0;padding:12px;overflow-x:auto}
.code-block code,.code-block code.hljs{background:transparent;padding:0;font-size:13px;line-height:1.55;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

.consilium-card{border:1px solid var(--elev);background:var(--surface);border-radius:14px;padding:12px 14px;margin:18px 0}
.cc-title{font-size:13px;font-weight:600;margin-bottom:10px}
.cc-chips{display:flex;flex-wrap:wrap;gap:8px}
.cc-chip{font-size:12px;background:var(--bg);border:1px solid var(--elev);border-radius:999px;padding:5px 10px;color:#B4B4B4}
.cc-chip em{font-style:normal;margin-left:6px}
.cc-chip.run em{animation:blink 1.2s infinite}
.cc-chip.ok em{color:var(--ok)}
.cc-chip.fail em{color:var(--bad)}
.cc-phase{margin-top:10px;font-size:12.5px;color:var(--muted)}

#composer{flex:0 0 auto;padding:6px 12px calc(10px + var(--safe-b));background:var(--bg)}
#attachRow,#pluginChips{max-width:768px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:6px}
.att-card{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--elev);
  border-radius:12px;padding:6px 8px;max-width:230px}
.att-thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:var(--elev)}
.att-ico{width:38px;height:38px;border-radius:8px;background:var(--elev);display:flex;align-items:center;
  justify-content:center;font-size:18px;flex:0 0 auto}
.att-meta{display:flex;flex-direction:column;min-width:0}
.att-meta b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.att-meta i{font-style:normal;font-size:11px;color:var(--dim)}
.att-card button{background:transparent;border:0;color:var(--muted);font-size:14px;padding:0 2px;flex:0 0 auto}
.att-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--elev);
  border-radius:10px;padding:5px 10px;font-size:12.5px;color:#B4B4B4}
.plugin-chip{background:var(--elev);border:1px solid var(--stroke);color:var(--text);border-radius:999px;
  padding:5px 12px;font-size:12.5px}
#inputRow{max-width:768px;margin:0 auto;display:flex;align-items:flex-end;gap:4px;
  background:var(--elev);border:1px solid transparent;border-radius:26px;padding:6px 8px}
#inputRow:focus-within{border-color:var(--stroke)}
#input{flex:1;background:transparent;border:0;outline:0;resize:none;color:var(--text);
  font-family:inherit;font-size:16px;line-height:1.5;max-height:160px;padding:8px 4px;min-width:0}
#input::placeholder{color:var(--dim)}
#btnPlus,#btnMic{width:36px;height:36px}
.send-btn{width:36px;height:36px;flex:0 0 auto;border:0;border-radius:50%;background:var(--text);
  color:var(--bg);display:flex;align-items:center;justify-content:center}
.send-btn:disabled{opacity:.35;cursor:default}
.send-btn svg{width:20px;height:20px}
#composerHint{max-width:768px;margin:8px auto 0;text-align:center;font-size:11px;color:var(--dim)}

#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30}
#sidebar{position:fixed;top:0;bottom:0;left:0;width:84vw;max-width:320px;z-index:40;background:var(--surface);
  border-right:1px solid var(--elev);display:flex;flex-direction:column;
  padding:calc(12px + var(--safe-t)) 12px calc(12px + var(--safe-b));
  transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sidebar.open{transform:none}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--bg);border:1px solid var(--stroke);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.side-new{width:100%;text-align:left;background:transparent;border:1px solid var(--stroke);border-radius:12px;
  padding:10px 12px;font-size:14px;font-weight:600;color:var(--text);margin-bottom:10px}
.side-new:hover{background:var(--elev)}
#chatSearch{width:100%;background:var(--bg);border:1px solid var(--elev);border-radius:10px;
  padding:8px 12px;color:var(--text);font-size:14px;outline:0;margin-bottom:10px;font-family:inherit}
#chatSearch:focus{border-color:var(--stroke)}
#chatList{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px;min-height:60px}
.chat-item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;cursor:pointer}
.chat-item:hover,.chat-item.active{background:var(--elev)}
.ci-title{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-edit{flex:1;min-width:0;background:var(--bg);border:1px solid var(--stroke);border-radius:6px;
  color:var(--text);font-size:14px;padding:3px 6px;outline:0;font-family:inherit}
.ci-btn{width:26px;height:26px;flex:0 0 auto;background:transparent;border:0;border-radius:6px;
  color:var(--muted);font-size:13px;opacity:.55}
.chat-item:hover .ci-btn{opacity:1}
.ci-btn:hover{background:var(--stroke);color:#fff}
.ci-btn.armed{color:var(--bad);opacity:1}
.ci-empty{color:var(--dim);font-size:13px;text-align:center;padding:16px 0}
.side-sep{height:1px;background:var(--elev);margin:10px 0}
.side-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:2px 2px 8px}
.svc{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;
  background:transparent;border:0;color:#D9D9D9;font-size:14px;text-align:left}
.svc:hover{background:var(--elev)}
.svc-dot{width:8px;height:8px;border-radius:50%;background:var(--c,#8A8A8A);flex:0 0 auto}
.side-settings{width:100%;display:flex;align-items:center;gap:10px;background:var(--elev);border:1px solid var(--stroke);
  border-radius:12px;padding:11px 12px;color:var(--text);font-size:14px;font-weight:600;text-align:left}
.side-settings:hover{background:var(--stroke)}
.side-auth{width:100%;margin-top:8px;background:transparent;border:1px solid var(--stroke);border-radius:12px;
  padding:9px 12px;color:var(--text);font-size:13px;text-align:left}
.side-auth:hover{background:var(--elev)}
.side-foot{font-size:11px;color:var(--dim);text-align:center;padding-top:10px}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--elev);border-radius:20px 20px 0 0;padding:8px 12px calc(16px + var(--safe-b));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:86vh;overflow-y:auto}
.sheet.open{transform:none}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--stroke);margin:6px auto 10px}
.sheet-title{font-size:13px;color:var(--muted);padding:0 6px 8px}
.sheet-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:12px;
  background:transparent;border:0;color:var(--text);text-align:left}
.sheet-item:hover{background:var(--elev)}
.si-ico{font-size:20px;width:28px;text-align:center;flex:0 0 auto}
.si-txt{flex:1;display:flex;flex-direction:column;min-width:0}
.si-txt b{font-size:14.5px;font-weight:600}
.si-txt i{font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.sheet-sep{height:1px;background:var(--elev);margin:6px 0}
.switch{width:40px;height:24px;flex:0 0 auto;border-radius:999px;background:var(--stroke);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:left .2s,background .2s}
.switch.on{background:var(--text)}
.switch.on::after{left:19px;background:var(--bg)}

.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{background:var(--surface);border:1px solid var(--elev);border-radius:18px;width:100%;
  max-width:440px;max-height:82vh;overflow-y:auto;padding:16px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:12px}
.model-item{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;
  border-radius:12px;border:1px solid transparent;background:transparent;color:var(--text);text-align:left}
.model-item:hover{background:var(--elev)}
.model-item.selected{border-color:var(--stroke);background:var(--elev)}
.mi-name{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mi-check{color:var(--ok)}
.mi-cool{font-size:10.5px;color:var(--warn);border:1px solid var(--stroke);border-radius:999px;padding:1px 6px}
.mi-desc{font-size:12px;color:var(--muted);line-height:1.4}
.modal-close{width:100%;margin-top:10px;padding:10px;border-radius:10px;background:var(--elev);border:0;color:var(--text);font-size:14px}
.confirm-text{font-size:14.5px;line-height:1.5;color:#D9D9D9;margin-bottom:14px}
.confirm-btns{display:flex;gap:8px}
.btn-primary{flex:1;padding:11px;border-radius:10px;background:var(--text);color:var(--bg);border:0;font-size:14px;font-weight:600}
.btn-ghost{flex:1;padding:11px;border-radius:10px;background:var(--elev);color:var(--text);border:1px solid var(--stroke);font-size:14px}
.seg{display:flex;background:var(--bg);border:1px solid var(--elev);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg-btn{flex:1;padding:9px 6px;border-radius:9px;background:transparent;border:0;color:var(--muted);font-size:12.5px}
.seg-btn.active{background:var(--elev);color:var(--text);font-weight:600}
.dev-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--elev)}
.dev-row .si-txt b{font-size:14px}
.diag{margin-top:12px;background:#0F0F0F;border:1px solid var(--elev);border-radius:10px;padding:10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:#B4B4B4;
  white-space:pre-wrap;word-break:break-word;max-height:200px;overflow-y:auto}
.dev-actions{display:flex;gap:8px;margin-top:10px}

#settingsOverlay{position:fixed;inset:0;z-index:75;background:var(--bg);display:flex;flex-direction:column}
.set-head{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 12px 10px;border-bottom:1px solid var(--elev)}
.set-title{font-size:15.5px;font-weight:700;flex:1}
.set-body{flex:1;overflow-y:auto;padding:14px 14px calc(24px + var(--safe-b));max-width:768px;margin:0 auto;width:100%}
.set-section{background:var(--surface);border:1px solid var(--elev);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.set-h{font-size:13px;font-weight:700;margin-bottom:10px;color:#D9D9D9}
.set-note{font-size:11.5px;color:var(--dim);line-height:1.45;margin-top:8px}
.acc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--elev);flex-wrap:wrap}
.acc-row:first-child{border-top:0}
.acc-dot{width:9px;height:9px;border-radius:50%;background:var(--stroke);flex:0 0 auto}
.acc-dot.opened{background:var(--warn)}
.acc-dot.linked{background:var(--ok)}
.acc-dot.none{background:var(--stroke)}
.acc-txt{flex:1;display:flex;flex-direction:column;min-width:120px}
.acc-txt b{font-size:14px;font-weight:600}
.acc-txt i{font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px}
.acc-btns{display:flex;gap:6px;flex:0 0 auto}
.acc-btn{background:var(--elev);border:1px solid var(--stroke);color:var(--text);border-radius:9px;padding:7px 11px;font-size:12.5px}
.acc-btn:hover{background:var(--stroke)}
.set-btns{display:flex;flex-wrap:wrap;gap:8px}
.set-btn{background:var(--elev);border:1px solid var(--stroke);color:var(--text);border-radius:10px;padding:10px 12px;font-size:13px}
.set-btn:hover{background:var(--stroke)}
.set-btn.danger{color:var(--bad);border-color:#4A2A2A}
.set-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--elev)}
.set-row:first-of-type{border-top:0}
.storage-info{font-size:12px;color:var(--muted);margin-bottom:10px}
.about{font-size:12px;color:var(--dim);text-align:center;padding:4px 0 10px}

#voiceOverlay{position:fixed;inset:0;z-index:85;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:24px}
.voice-close{position:absolute;top:calc(12px + var(--safe-t));right:12px}
#sphereWrap{width:210px;height:210px;position:relative;display:flex;align-items:center;justify-content:center;--rms:0}
#sphere{width:142px;height:142px;border-radius:50%;border:1px solid var(--stroke);
  background:radial-gradient(circle at 32% 30%,#4A4A4A,#2F2F2F 45%,#171717 78%);
  box-shadow:0 0 60px rgba(255,255,255,.08),inset 0 0 30px rgba(255,255,255,.06);
  transform:scale(calc(1 + var(--rms)*.38));transition:transform .09s linear}
.sphere-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.12);
  opacity:.25;animation:ringPulse 2.4s ease-out infinite;animation-play-state:paused}
.sphere-ring.r2{animation-delay:1.2s}
@keyframes ringPulse{0%{transform:scale(.72);opacity:.9}100%{transform:scale(1.16);opacity:0}}
#voiceOverlay[data-state="listening"] .sphere-ring,
#voiceOverlay[data-state="speaking"] .sphere-ring,
#voiceOverlay[data-state="thinking"] .sphere-ring{animation-play-state:running}
#voiceOverlay[data-state="thinking"] .sphere-ring{animation-duration:1.2s}
#voiceStatus{font-size:17px;font-weight:600}
#voiceTranscript{min-height:52px;max-width:520px;text-align:center;color:#D9D9D9;font-size:16px;line-height:1.5}
#voiceTranscript.interim{color:var(--muted)}
#voiceTranscript.final{color:var(--text);font-weight:600}
#voiceHint{font-size:12.5px;color:var(--dim);text-align:center}
body.fps60 #sphere{transition:transform .016s linear;will-change:transform}
body.fps60 .sphere-ring{animation-duration:1.6s;will-change:transform,opacity}
body.fps60 .typing i{animation-duration:.8s}
body.fps60 #sidebar,body.fps60 .sheet{transition-duration:.18s}
body.fps60 .toast{animation-duration:.16s}

#sandboxOverlay{position:fixed;inset:0;z-index:78;background:var(--bg);display:flex;flex-direction:column}
.sb-head{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 12px 10px;
  border-bottom:1px solid var(--elev);flex-wrap:wrap}
.sb-title{font-size:14px;font-weight:600}
.sb-tabs{display:flex;background:var(--surface);border-radius:10px;padding:3px}
.sb-tab{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--muted);background:transparent;border:0}
.sb-tab.active{background:var(--elev);color:var(--text)}
.sb-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.sb-btn{background:var(--elev);border:1px solid var(--stroke);color:var(--text);border-radius:10px;padding:7px 12px;font-size:13px}
.sb-btn:hover{background:var(--stroke)}
#sbBody{flex:1;position:relative;overflow:hidden}
#sbCode{position:absolute;inset:0;width:100%;height:100%;background:#0F0F0F;color:var(--text);border:0;outline:0;
  resize:none;padding:14px;font-size:13px;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#sbFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#sbBody[data-tab="code"] #sbFrame{display:none}
#sbBody[data-tab="preview"] #sbCode{display:none}
@media (min-width:900px){
  #sbBody[data-tab] #sbCode{display:block;width:50%}
  #sbBody[data-tab] #sbFrame{display:block;left:50%;width:50%}
  .sb-tabs{display:none}
}

#welcome{text-align:center;padding:9vh 8px 24px}
#welcomeLogo{width:76px;height:76px;margin:0 auto}
#welcomeLogo svg{width:76px;height:76px;display:block}
#welcome h1{font-size:26px;font-weight:700;margin:14px 0 6px}
#welcome p{color:var(--muted);font-size:14.5px;margin:0 0 22px}
.sugg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto}
.sugg{background:var(--surface);border:1px solid var(--elev);border-radius:14px;padding:14px;
  font-size:13.5px;color:#D9D9D9;text-align:left;line-height:1.4}
.sugg:hover{background:var(--elev)}

#toasts{position:fixed;bottom:calc(96px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:95;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:var(--elev);border:1px solid var(--stroke);color:var(--text);padding:10px 16px;border-radius:12px;
  font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fadeUp .25s;max-width:90vw;text-align:center}
.toast.out{opacity:0;transform:translateY(6px);transition:.3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:600px){
  #messages{padding:16px 12px}
  .bubble{max-width:92%}
  .sugg-grid{grid-template-columns:1fr}
  .att-card{max-width:47%}
}
         </style>
